version: '3.4'

services:

# --- DB ---

  pgadmin:
    container_name: pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=root
    restart: always
    ports:
      - "5450:80"
    depends_on:
      - catalog.database
      - basket.database

  catalog.database:
    container_name: catalog-database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eshop_catalog
    restart: always
    ports:
      - "5400:5432"
    volumes:
      - catalog_db:/var/lib/postgresql
   
  basket.database:
    container_name: basket-database
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo
      - MONGO_INITDB_ROOT_PASSWORD=mongo
      - MONGO_INITDB_DATABASE=eshop_basket
    restart: always
    ports:
      - "5401:27017"
    volumes:
      - basket_db:/data/db

  basket.cache:
    container_name: basket-cache
    restart: always
    ports:
      - "6379:6379"

# --- API ---

  catalog.api:
    container_name: catalog-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Database=Server=catalog.database;Port=5432;Database=eshop_catalog;User Id=postgres;Password=postgres;Include Error Detail=true
    ports:
      - "6000:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - catalog.database

  basket.api:
    container_name: basket-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - MongoDbSettings__ConnectionString=mongodb://mongo:mongo@basket.database:27017
      - RedisSettings__ConnectionString=basket.cache:6379
    ports:
      - "6001:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - basket.database
      - basket.cache
