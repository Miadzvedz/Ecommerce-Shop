name: eshop-dev

services:

# --- DB ---

  catalog.database:
    container_name: dev-catalog-database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=eshop_catalog
    restart: always
    ports:
      - "5400:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
   
  basket.database:
    container_name: dev-basket-database
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=eshop_basket
    restart: always
    ports:
      - "5401:27017"
    healthcheck:
      test: [
        "CMD", 
        "mongosh", 
        "--username", "mongo", 
        "--password", "${MONGO_PASSWORD}", 
        "--authenticationDatabase", "admin", 
        "--eval", "db.adminCommand('ping').ok", 
        "--quiet"
      ]
      interval: 10s
      timeout: 5s     
      retries: 3
      start_period: 15s

  basket.cache:
    container_name: dev-basket-cach
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    ports:
      - "6379:6379"

# --- API ---

  catalog.api:
    container_name: dev-catalog-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Database=Server=catalog.database;Port=5432;Database=eshop_catalog;User Id=postgres;Password=${POSTGRES_PASSWORD};Include Error Detail=true
    ports:
      - "6000:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
        catalog.database:
            condition: service_healthy

  basket.api:
    container_name: dev-basket-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - MongoDbSettings__ConnectionString=mongodb://mongo:${MONGO_PASSWORD}@basket.database:27017
      - RedisSettings__ConnectionString=basket.cache:6379,password=${REDIS_PASSWORD}
    ports:
      - "6001:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      basket.cache:
        condition: service_started
      basket.database:
        condition: service_healthy

  discount.api:
    container_name: dev-discount-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Database=Data Source=/app/data/discountdb
    ports:
      - "6002:8080"
    volumes:
      - ./data:/app/data
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
