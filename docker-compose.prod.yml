name: eshop-prod

services:

  # --- DB ---    

  catalog.database:
    container_name: prod-catalog-database
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=eshop_catalog
    restart: always
    volumes:
      - catalog_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  basket.database:
    container_name: prod-basket-database
    image: mongo:8.3
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_ROOT_DATABASE=eshop_basket
    restart: always
    volumes:
      - basket_db:/data/db
    healthcheck:
      test: [
        "CMD", 
        "mongosh", 
        "--username", "mongo", 
        "--password", "${MONGO_PASSWORD}", 
        "--authenticationDatabase", "admin", 
        "--eval", "db.adminCommand('ping').ok", 
        "--quiet"
      ]
      interval: 10s
      timeout: 5s     
      retries: 3
      start_period: 15s

  basket.cache:
    container_name: prod-basket-cache
    image: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always

  # --- API ---

  catalog.api:
    container_name: prod-catalog-service
    image: ghcr.io/miadzvedz/ecommerce-shop/catalog-service:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Server=catalog.database;Port=5432;Database=eshop_catalog;User Id=postgres;Password=${POSTGRES_PASSWORD}
    ports:
      - "7000:8080"
    depends_on:
      - catalog.database

  basket.api:
    container_name: prod-basket-service
    image: ghcr.io/miadzvedz/ecommerce-shop/basket-service:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MongoDbSettings__ConnectionString=mongodb://mongo:${MONGO_PASSWORD}@basket.database:27017
      - RedisSettings__ConnectionString=basket.cache:6379,password=${REDIS_PASSWORD}
    ports:
      - "7001:8080"
    depends_on:
      - basket.database
      - basket.cache

  discount.api:
    container_name: prod-discount-service
    image: ghcr.io/miadzvedz/ecommerce-shop/discount-service:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Data Source=/app/db/discountdb
    ports:
      - "7002:8080"
    volumes:
      - discount_db:/app/db

volumes:
  discount_db:    
  catalog_db:
  basket_db:
