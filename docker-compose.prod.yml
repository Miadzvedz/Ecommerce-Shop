services:

  # --- DB ---    

  catalog.database:
    container_name: catalog-database
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=eshop_catalog
    restart: always
    ports:
      - "5400:5432"
    volumes:
      - catalog_db:/var/lib/postgresql/data

  basket.database:
    container_name: basket-database
    image: mongo:6.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_ROOT_DATABASE=eshop_basket
    restart: always
    ports:
      - "5481:27017"
    volumes:
      - basket_db:/data/db

  basket.cache:
    container_name: basket-cache
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    ports:
      - "6379:6379"

  # --- API ---

  catalog.api:
    container_name: catalog-service
    image: ghcr.io/miadzvedz/ecommerce-store/catalog-service:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Server=catalog.database;Port=5432;Database=eshop_catalog;User Id=postgres;Password=${POSTGRES_PASSWORD}
    ports:
      - "6000:8080"
    depends_on:
      - catalog.database

  basket.api:
    container_name: basket-service
    image: ghcr.io/miadzvedz/ecommerce-store/basket-service:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MongoDbSettings__ConnectionString=mongodb://mongo:${MONGO_PASSWORD}@basket.database:27017
      - RedisSettings__ConnectionString=basket.cache:6379,password=${REDIS_PASSWORD}
    ports:
      - "6001:8080"
    depends_on:
      - basket.database
      - basket.cache

volumes:
  catalog_db:
  basket_db:
