name: CI/CD Pipeline

# Фильтрация по веткам для команд
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Разрешает пайплайну читать содержимое репозитория и право на публикацию и обновление (GitHub Container Registry (ghcr.io))
permissions:
  contents: read
  packages: write

jobs:
  # --- СТАДИЯ 1: СБОРКА И ТЕСТИРОВАНИЕ ---
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Кэширование Nuget-пакетов для ускорения повторных запусков пайплайна
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore Ecommerce-Shop.sln

    - name: Build Solution
      run: dotnet build Ecommerce-Shop.sln --no-restore --configuration Release

    # Запуск всех тестов (Unit и Integration)
    # В этот момент IAsyncLifetime будет успешно обращаться к Docker хоста
    - name: Run Tests
      run: dotnet test Ecommerce-Shop.sln --no-build --configuration Release --verbosity normal

  # --- СТАДИЯ 2: СБОРКА И ПУШ DOCKER-ОБРАЗОВ ---
  # Запускается ТОЛЬКО если тесты прошли успешно И это пуш в ветку main
  deploy-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Авторизуемся в GitHub Container Registry (ghcr.io), используя встроенный токен
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Переводим имя репозитория в нижний регистр (требование Docker для тегов)
    - name: Downcase repository name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    # Сборка и отправка микросервиса Каталога
    - name: Build and Push Catalog Service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/Services/Catalog/Dockerfile 
        push: true
        tags: ghcr.io/${{ env.REPO_LOWER }}/catalog-service:latest

    # Сборка и отправка микросервиса Корзины
    - name: Build and Push Basket Service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/Services/Basket/Dockerfile
        push: true
        tags: ghcr.io/${{ env.REPO_LOWER }}/basket-service:latest

