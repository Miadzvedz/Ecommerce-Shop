services:

# --- DB ---

  catalog.database:
    image: postgres:16
    volumes:
      - catalog_db:/var/lib/postgresql/data

  basket.database:    
    image: mongo:8.3
    volumes:
      - basket_db:/data/db

  basket.cache:   
    image: redis


# --- API ---

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalog-service
    build:
      context: .
      dockerfile: src/Services/Catalog/Dockerfile

  basket.api:
    image: ${DOCKER_REGISTRY-}basket-service
    build:
      context: .
      dockerfile: src/Services/Basket/Dockerfile

  discount.api:
    image: ${DOCKER_REGISTRY-}discount-service
    build:
      context: .
      dockerfile: src/Services/Discount/Dockerfile

volumes:
  catalog_db:
  basket_db: